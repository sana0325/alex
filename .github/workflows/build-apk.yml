name: Build Android APK + AAB

on:
  push:
    branches: [ main, claude/android-gold-scalp-bot-C6PB6, claude/crypto-wallet-recovery-ZGLCq ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # ── Debug keystore (для тестового APK) ──────────────────────────────
      - name: Setup fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Freelance Hub, OU=Android, O=FreelanceHub, L=UA, S=UA, C=UA"
          fi

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-freelancehub-v1

      # ── Debug APK (для встановлення напряму) ────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FreelanceHub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreelanceHub-apk
          path: FreelanceHub.apk
          retention-days: 90

      # ── Release AAB (для Google Play Store) ─────────────────────────────
      # Потрібно додати секрети в GitHub:
      #   KEYSTORE_BASE64  — keystore закодований в base64
      #   KEYSTORE_PASSWORD — пароль keystore
      #   KEY_ALIAS        — alias ключа
      #   KEY_PASSWORD     — пароль ключа
      # Команда для створення keystore:
      #   keytool -genkey -v -keystore release.keystore -alias freelancehub
      #            -keyalg RSA -keysize 2048 -validity 10000
      # Команда для base64:
      #   base64 -w 0 release.keystore
      - name: Setup release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Release AAB (Play Store)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload AAB artifact (Play Store)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreelanceHub-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # ── GitHub Release (тільки main) ─────────────────────────────────────
      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Freelance Hub v${{ github.run_number }}"
          body: |
            ## 📲 Freelance Hub — Android APK

            ### Встановлення (перший раз):
            1. Завантажте **FreelanceHub.apk** нижче
            2. На телефоні: Налаштування → Безпека → **Невідомі джерела** → Увімкнути
            3. Відкрийте завантажений APK → Встановити

            ### Оновлення:
            - Встановіть новий APK поверх старого — підпис постійний

            ### Функції:
            - 13+ фріланс-платформ для заробітку без вкладень
            - Трекер заробітку з графіком
            - Профіль з навичками та ставкою
            - Реклама AdMob (банер + interstitial)
          files: FreelanceHub.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
