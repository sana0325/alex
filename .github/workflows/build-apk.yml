name: Build FitLife APK

on:
  push:
    branches: [fitlife]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/FitLife.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: FitLife-apk
          path: out/FitLife.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fitlife-v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/FitLife.apk \
            --target "${{ github.sha }}" \
            --title "FitLife 1.0 (збірка ${{ github.run_number }})" \
            --notes "Встанови FitLife.apk на Android (дозволь встановлення з невідомих джерел)."
