name: Build FitLife APK

on:
  push:
    branches: [fitlife]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg > /dev/null
          pip install -q edge-tts mido numpy

      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: audio_cache
          key: audio-v1-${{ hashFiles('www/js/data.js', 'scripts/build_audio.py') }}
          restore-keys: audio-v1-

      - name: Generate voice + orchestral audio
        run: |
          node scripts/export_content.cjs content.json
          python3 scripts/build_audio.py content.json www/audio audio_cache /usr/share/sounds/sf2/FluidR3_GM.sf2
          du -sh www/audio www/audio/*
          (cd www && zip -qr ../audio.zip audio)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/FitLife.apk
          (cd out && zip -q FitLife_APK.zip FitLife.apk)
          cp audio.zip out/
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fitlife-v1.2.${{ github.run_number }}"
          gh release create "$TAG" out/FitLife.apk out/FitLife_APK.zip out/audio.zip \
            --target "${{ github.sha }}" \
            --title "FitLife 1.2 (збірка ${{ github.run_number }})" \
            --notes "Встанови FitLife.apk (працює на 32- і 64-бітних Android 7+). Дозволь встановлення з невідомих джерел."
