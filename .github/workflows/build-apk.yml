name: Build Android APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Use a fixed debug keystore so every build has the same signature.
      # This prevents "package conflict" errors when updating the app.
      - name: Setup fixed debug keystore
        run: |
          mkdir -p ~/.android
          # Generate a stable keystore if it doesn't exist in cache
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Gold Scalp Signals, OU=Android, O=GoldScalp, L=UA, S=UA, C=UA"
          fi

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             SmcAiTrader.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmcAiTrader-apk
          path: SmcAiTrader.apk
          retention-days: 90

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "ШІ Скальп-бот v${{ github.run_number }}"
          body: |
            ## 📲 Мульти-ринок ШІ Скальп-бот — Android APK

            ### Встановлення (перший раз):
            1. Завантажте **SmcAiTrader.apk** нижче
            2. На телефоні: Налаштування → Безпека → **Невідомі джерела** → Увімкнути
            3. Відкрийте завантажений APK → Встановити
            4. Відкрийте додаток → натисніть ⚙ і вкажіть:
               - BingX API Key / Secret (право торгівлі на Perpetual Futures)
               - свій DeepSeek API ключ

            ### Оновлення (якщо вже встановлено):
            - Просто встановіть новий APK поверх старого — підпис постійний

            ### Функції:
            - 12 пар через BingX (BTC, ETH, SOL, BNB, XRP, DOGE, ADA, LINK, AVAX, LTC, TON + золото PAXG) · M5
            - ШІ SMC-аналіз (DeepSeek), плече 20x, драбина ставок від $2
            - Лімітні ордери-мейкери, послідовна торгівля (одна угода за раз)
            - Журнал угод, авто-розбір раз на 2 дні, демо-режим без підключення до біржі
            - Push-сповіщення при закритті угоди
          files: SmcAiTrader.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
