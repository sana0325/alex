name: РЕР-Тренажер — збірка

on:
  push:
    paths:
      - 'rer_trainer/**'
      - '.github/workflows/rer-trainer.yml'
  pull_request:
    paths:
      - 'rer_trainer/**'
      - '.github/workflows/rer-trainer.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: rer_trainer

jobs:
  android:
    name: Аналіз, тести, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Збірка APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-phone-release.apk
          flutter build apk --release

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-android-apk
          path: |
            rer_trainer/build/app/outputs/flutter-apk/app-release.apk
            rer_trainer/build/app/outputs/flutter-apk/app-phone-release.apk

  android-smoke:
    name: Запуск APK на емуляторі
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: rer-trainer-android-apk
          path: apk
      - name: Увімкнути KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash rer_trainer/tool/android_smoke.sh apk/app-release.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-smoke
          path: |
            smoke-screen.png
            smoke-logcat.txt

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      # Бібліотеки Visual C++ — щоб програма запускалася й без
      # встановленого Visual C++ Redistributable.
      - name: Додати бібліотеки Visual C++
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$f" $dst
          }
          Copy-Item "windows/diagnostyka.bat" "$dst/Діагностика.bat"
          Get-ChildItem $dst

      - name: Інсталятор (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer.iss
          Get-ChildItem build/installer

      - name: Перевірка інсталятора
        shell: pwsh
        run: |
          $setup = Get-Item build/installer/RER-Trener-Setup.exe
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\RER-Trener\rer_trainer.exe'
          if (!(Test-Path $exe)) { Write-Host "ЗБІЙ: інсталятор не встановив програму"; exit 1 }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Host "ЗБІЙ: встановлена програма завершилася, код $($p.ExitCode)"; exit 1 }
          Write-Host "OK: встановлена програма працює"
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-windows-setup
          path: rer_trainer/build/installer/RER-Trener-Setup.exe

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-windows
          path: rer_trainer/build/windows/x64/runner/Release/

      - name: Перевірка запуску (шлях з кирилицею)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:RUNNER_TEMP/rer.zip" -Force
          ../rer_trainer/tool/windows_smoke.ps1 -Zip "$env:RUNNER_TEMP/rer.zip"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-smoke
          path: win-screen.png

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Системні залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-linux
          path: rer_trainer/build/linux/x64/release/bundle/

  web:
    name: Веб-версія (GitHub Pages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/ --no-web-resources-cdn
      - name: Опублікувати в гілку gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: rer_trainer/build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

  release:
    name: Публікація для завантаження
    needs: [android, android-smoke, windows, linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Підготовка файлів
        run: |
          cp dist/rer-trainer-android-apk/app-phone-release.apk RER-Trener.apk
          cp dist/rer-trainer-android-apk/app-release.apk RER-Trener-universalnyi.apk
          cp dist/rer-trainer-windows-setup/RER-Trener-Setup.exe RER-Trener-Setup.exe
          (cd dist/rer-trainer-windows && zip -qr ../../RER-Trener-Windows.zip .)
          chmod +x dist/rer-trainer-linux/rer_trainer
          tar -czf RER-Trener-Linux.tar.gz -C dist/rer-trainer-linux .

      - name: Оновлення релізу
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete rer-trainer-latest --cleanup-tag -y || true
          gh release create rer-trainer-latest RER-Trener.apk RER-Trener-universalnyi.apk RER-Trener-Setup.exe RER-Trener-Windows.zip RER-Trener-Linux.tar.gz \
            --target "$GITHUB_SHA" \
            --title "РЕР-Тренажер (остання збірка)" \
            --notes "Android: RER-Trener.apk (усі телефони ARM, 32 і 64 біт). RER-Trener-universalnyi.apk — додатково для емуляторів x86. Windows: RER-Trener-Setup.exe (інсталятор) або RER-Trener-Windows.zip (розпакувати й запустити rer_trainer.exe; якщо не стартує — Діагностика.bat). Linux: розпакуйте RER-Trener-Linux.tar.gz і запустіть ./rer_trainer."
