name: РЕР-Тренажер — збірка

on:
  push:
    paths:
      - 'rer_trainer/**'
      - '.github/workflows/rer-trainer.yml'
  pull_request:
    paths:
      - 'rer_trainer/**'
      - '.github/workflows/rer-trainer.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: rer_trainer

jobs:
  android:
    name: Аналіз, тести, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Збірка APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-phone-release.apk
          flutter build apk --release

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-android-apk
          path: |
            rer_trainer/build/app/outputs/flutter-apk/app-release.apk
            rer_trainer/build/app/outputs/flutter-apk/app-phone-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      # Бібліотеки Visual C++ — щоб програма запускалася й без
      # встановленого Visual C++ Redistributable.
      - name: Додати бібліотеки Visual C++
        shell: pwsh
        run: |
          $dst = "build/windows/x64/runner/Release"
          foreach ($f in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$f" $dst
          }
          Get-ChildItem $dst

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-windows
          path: rer_trainer/build/windows/x64/runner/Release/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Системні залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v6
        with:
          name: rer-trainer-linux
          path: rer_trainer/build/linux/x64/release/bundle/

  release:
    name: Публікація для завантаження
    needs: [android, windows, linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Підготовка файлів
        run: |
          cp dist/rer-trainer-android-apk/app-phone-release.apk RER-Trener.apk
          cp dist/rer-trainer-android-apk/app-release.apk RER-Trener-universalnyi.apk
          (cd dist/rer-trainer-windows && zip -qr ../../RER-Trener-Windows.zip .)
          chmod +x dist/rer-trainer-linux/rer_trainer
          tar -czf RER-Trener-Linux.tar.gz -C dist/rer-trainer-linux .

      - name: Оновлення релізу
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete rer-trainer-latest --cleanup-tag -y || true
          gh release create rer-trainer-latest RER-Trener.apk RER-Trener-universalnyi.apk RER-Trener-Windows.zip RER-Trener-Linux.tar.gz \
            --target "$GITHUB_SHA" \
            --title "РЕР-Тренажер (остання збірка)" \
            --notes "Android: RER-Trener.apk (усі телефони ARM, 32 і 64 біт). RER-Trener-universalnyi.apk — додатково для емуляторів x86. Windows: розпакуйте RER-Trener-Windows.zip і запустіть rer_trainer.exe. Linux: розпакуйте RER-Trener-Linux.tar.gz і запустіть ./rer_trainer."
