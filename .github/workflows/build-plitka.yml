name: Build Plitka AR APK

on:
  push:
    branches: [ paving-ar ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: plitka-debug-keystore-v1

      - name: Fixed debug keystore (same signature on every build)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Plitka AR, O=Alex, C=UA"
          fi

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk PlitkaAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlitkaAR
          path: PlitkaAR.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plitka-${{ github.sha }}
          name: Plitka AR ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: PlitkaAR.apk
