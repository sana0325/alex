plugins { id 'com.android.application' }
android {
    namespace 'ua.fitlife.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ua.fitlife.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            storeFile file('fitlife.jks')
            storePassword 'fitlife2026'
            keyAlias 'fitlife'
            keyPassword 'fitlife2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
